<div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">

        <thead class="table-light">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Descripción</th>
                <th scope="col">Créditos</th>
                <th scope="col">Semestre</th>
                <th scope="col">Estado</th>
                <th scope="col">Opciones</th>
            </tr>
        </thead>

        <tbody>
            @for (course of courses; track course.id) {
                <tr>
                    <td>{{ course.id }}</td>
                    <td class="fw-semibold">{{ course.name }}</td>
                    <td class="text-start text-truncate" style="max-width: 320px;" [title]="course.description">
                        {{ course.description }}
                    </td>
                    <td><span class="badge text-bg-secondary">{{ course.credits }}</span></td>
                    <td><span class="badge text-bg-info">{{ course.semester }}°</span></td>
                    <td>
                        @if (course.status) {
                            <span class="badge text-bg-success">Activo</span>
                        } @else {
                            <span class="badge text-bg-danger">Inactivo</span>
                        }
                    </td>
                    <td>
                        <app-table-actions [id]="course.id" (onAction)="onClickActions.emit($event)" />
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="7" class="text-center py-4 text-muted">
                        No hay cursos registrados.
                    </td>
                </tr>
            }
        </tbody>

    </table>
</div>
