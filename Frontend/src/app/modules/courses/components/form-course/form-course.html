<form [formGroup]="form" (ngSubmit)="submit()">

    <div class="row g-3">

        <div class="col-md-6">
            <label for="name" class="form-label">Nombre del curso *</label>
            <input type="text" id="name" class="form-control" formControlName="name"
                [class.is-invalid]="isInvalid('name')" placeholder="Ej: Programación Web I">
            @if (isInvalid('name')) {
                <small class="text-danger">El nombre es obligatorio (máximo 100 caracteres).</small>
            }
        </div>

        <div class="col-md-3">
            <label for="credits" class="form-label">Créditos *</label>
            <select id="credits" class="form-select" formControlName="credits">
                @for (credit of credits; track credit) {
                    <option [ngValue]="credit">{{ credit }}</option>
                }
            </select>
        </div>

        <div class="col-md-3">
            <label for="semester" class="form-label">Semestre *</label>
            <select id="semester" class="form-select" formControlName="semester">
                @for (semester of semesters; track semester) {
                    <option [ngValue]="semester">Semestre {{ semester }}</option>
                }
            </select>
        </div>

        <div class="col-12">
            <label for="description" class="form-label">Descripción *</label>
            <textarea id="description" rows="3" class="form-control" formControlName="description"
                [class.is-invalid]="isInvalid('description')"
                placeholder="Describe el contenido del curso"></textarea>
            @if (isInvalid('description')) {
                <small class="text-danger">La descripción es obligatoria.</small>
            }
        </div>

        <div class="col-12">
            <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" id="status" formControlName="status">
                <label class="form-check-label" for="status">Curso activo</label>
            </div>
        </div>

    </div>

    <hr class="my-4">

    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="formCancel.emit()">
            Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
            <i class="bi bi-save me-2"></i>
            {{ submitLabel }}
        </button>
    </div>

</form>
