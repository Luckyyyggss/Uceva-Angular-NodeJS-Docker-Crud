<app-back />

<div class="container-fluid py-4">

    <div class="mb-4">
        <h3 class="fw-bold mb-1">Editar curso</h3>
        <p class="text-muted mb-0">Modifica la información del curso #{{ id }}.</p>
    </div>

    <div class="card border">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Información del curso</h5>
        </div>
        <div class="card-body">
            @if (course) {
                <app-form-course [course]="course" submitLabel="Actualizar curso" [saving]="saving"
                    (formSubmit)="updateCourse($event)" (formCancel)="goToList()" />
            } @else {
                <div class="text-center text-muted py-4">Cargando curso...</div>
            }
        </div>
    </div>

</div>
