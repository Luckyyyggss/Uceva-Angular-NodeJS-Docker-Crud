<app-back />

<div class="container-fluid py-4">

    <div class="mb-4">
        <h3 class="fw-bold mb-1">Editar calificación</h3>
        <p class="text-muted mb-0">Modifica la información de la calificación #{{ id }}.</p>
    </div>

    <div class="card border">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Información de la calificación</h5>
        </div>
        <div class="card-body">
            @if (calificacion) {
                <app-form-calificacion [calificacion]="calificacion" [students]="students" [courses]="courses"
                    [isEdit]="true" submitLabel="Actualizar calificación" [saving]="saving"
                    (formSubmit)="updateCalificacion($event)" (formCancel)="goToList()" />
            } @else {
                <div class="text-center text-muted py-4">Cargando calificación...</div>
            }
        </div>
    </div>

</div>
