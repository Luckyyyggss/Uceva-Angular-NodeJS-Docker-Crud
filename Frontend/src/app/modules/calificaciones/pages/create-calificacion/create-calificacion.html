<app-back />

<div class="container-fluid py-4">

    <div class="mb-4">
        <h3 class="fw-bold mb-1">Registrar calificación</h3>
        <p class="text-muted mb-0">Completa la información para registrar una nueva calificación.</p>
    </div>

    <div class="card border">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="bi bi-journal-check me-2"></i>Información de la calificación</h5>
        </div>
        <div class="card-body">
            <app-form-calificacion [students]="students" [courses]="courses"
                submitLabel="Registrar calificación" [saving]="saving"
                (formSubmit)="createCalificacion($event)" (formCancel)="goToList()" />
        </div>
    </div>

</div>
