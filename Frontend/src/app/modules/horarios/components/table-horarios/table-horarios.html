<div class="table-responsive">
    <table class="table table-hover table-bordered align-middle">

        <thead class="table-light">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Día</th>
                <th scope="col">Hora de inicio</th>
                <th scope="col">Hora de fin</th>
                <th scope="col">Asignatura</th>
                <th scope="col">Opciones</th>
            </tr>
        </thead>

        <tbody>
            @for (horario of horarios; track horario.id) {
                <tr>
                    <td>{{ horario.id }}</td>
                    <td><span class="badge text-bg-info">{{ horario.dia }}</span></td>
                    <td>{{ horario.hora_inicio }}</td>
                    <td>{{ horario.hora_fin }}</td>
                    <td class="fw-semibold">{{ horario.asignatura }}</td>
                    <td>
                        <app-table-actions [id]="horario.id" (onAction)="onClickActions.emit($event)" />
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="6" class="text-center py-4 text-muted">
                        No hay horarios registrados.
                    </td>
                </tr>
            }
        </tbody>

    </table>
</div>
