<app-back />

<div class="container-fluid py-4">

    <div class="mb-4">
        <h3 class="fw-bold mb-1">Registrar horario</h3>
        <p class="text-muted mb-0">Completa la información para registrar un nuevo horario.</p>
    </div>

    <div class="card border">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0"><i class="bi bi-calendar-plus me-2"></i>Información del horario</h5>
        </div>
        <div class="card-body">
            <app-form-horario submitLabel="Registrar horario" [saving]="saving"
                (formSubmit)="createHorario($event)" (formCancel)="goToList()" />
        </div>
    </div>

</div>
