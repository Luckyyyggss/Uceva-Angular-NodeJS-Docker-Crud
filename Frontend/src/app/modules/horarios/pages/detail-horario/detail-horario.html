<app-back />
<div class="container-fluid mt-3">

    <div class="mb-4">
        <h3 class="fw-bold mb-1">Detalle del horario</h3>
        <p class="text-muted mb-0">Información de la franja horaria seleccionada.</p>
    </div>

    @if (horario) {

        <div class="card border mb-4">
            <div class="card-body p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center"
                        style="width: 65px; height: 65px; font-size: 2rem;">
                        <i class="bi bi-calendar-week-fill"></i>
                    </div>
                    <div class="flex-grow-1">
                        <h4 class="fw-bold mb-1">{{ horario.asignatura }}</h4>
                        <span class="text-muted">Horario #{{ horario.id }}</span>
                    </div>
                    <span class="badge rounded-pill text-bg-info">{{ horario.dia }}</span>
                </div>
            </div>
        </div>

        <div class="card border">
            <div class="card-header bg-white py-3">
                <h5 class="fw-semibold mb-0">
                    <i class="bi bi-clock text-primary me-2"></i>Franja horaria
                </h5>
            </div>
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-md-4">
                        <small class="text-muted d-block mb-1">Día</small>
                        <span class="fw-semibold">{{ horario.dia }}</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block mb-1">Hora de inicio</small>
                        <span class="fw-semibold">{{ horario.hora_inicio }}</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block mb-1">Hora de fin</small>
                        <span class="fw-semibold">{{ horario.hora_fin }}</span>
                    </div>
                </div>
            </div>
        </div>

    }

</div>
